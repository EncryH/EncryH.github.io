---
layout: default
---
{% if page.redirect_categories %}
<script>
(() => {
  const categories = {
    {% for category in site.categories %}{{ category[0] | slugify | jsonify }}: {{ category[0] | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %}
  };
  let slug = '';
  try { slug = decodeURIComponent(window.location.hash.slice(1)).toLowerCase(); } catch (_) {}
  const target = new URL({{ page.redirect_to | relative_url | jsonify }}, window.location.href);
  if (Object.hasOwn(categories, slug)) target.searchParams.set('category', categories[slug]);
  window.location.replace(target.href);
})();
</script>
{% endif %}
<main id="main" class="personal-main"><header class="personal-page-heading"><h1>{{ page.title }}</h1><p><a href="{{ page.redirect_to | relative_url }}">{{ page.link_label }}</a></p></header></main>
